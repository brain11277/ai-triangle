<svg xmlns="http://www.w3.org/2000/svg" width="700" height="320" viewBox="0 0 700 320" role="img" aria-label="Two AI Triangle failure modes drawn as warped shapes.">
<!-- Two AI Triangle failure modes drawn as warped shapes.
       The AI Triangle by Brian Rain. Licensed CC BY-NC-SA 4.0.
       https://brianrain.com/ai-triangle/
       Recoloring or editing this file is an adaptation: the result carries the same license. -->

  <rect width="700" height="320" fill="#F0E4CC"/>
  <g transform="translate(20,0)">
    <polygon points="230,58 70,322 390,322" fill="none" stroke="#B9A184" stroke-width="2"
             stroke-dasharray="5 5" stroke-linejoin="round" transform="scale(0.62) translate(30,30)"/>
    <polygon points="230.0,58.0 70.0,322.0 230.0,234.0" fill="rgba(181,83,42,0.20)" stroke="#6B1F1A"
             stroke-width="2.5" stroke-linejoin="round" transform="scale(0.62) translate(30,30)"/>
    <text x="160" y="278" text-anchor="middle" font-family="'Source Serif 4', Georgia, 'Times New Roman', serif" font-size="19" font-weight="600" fill="#6B1F1A">Over-prompting hide</text>
    <text x="160" y="300" text-anchor="middle" font-family="'IBM Plex Sans', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" fill="#3D3835">Self and tools held. New AI at 1.</text>
  </g>
  <g transform="translate(370,0)">
    <polygon points="230,58 70,322 390,322" fill="none" stroke="#B9A184" stroke-width="2"
             stroke-dasharray="5 5" stroke-linejoin="round" transform="scale(0.62) translate(30,30)"/>
    <polygon points="230.0,234.0 190.0,256.0 390.0,322.0" fill="rgba(181,83,42,0.20)" stroke="#6B1F1A"
             stroke-width="2.5" stroke-linejoin="round" transform="scale(0.62) translate(30,30)"/>
    <text x="160" y="278" text-anchor="middle" font-family="'Source Serif 4', Georgia, 'Times New Roman', serif" font-size="19" font-weight="600" fill="#6B1F1A">Tool sprawl</text>
    <text x="160" y="300" text-anchor="middle" font-family="'IBM Plex Sans', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" fill="#3D3835">New AI at 5. Self and tools collapsing.</text>
  </g>
</svg>

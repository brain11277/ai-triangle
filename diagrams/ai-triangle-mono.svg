  <circle cx="70" cy="322" r="9" fill="#000000"/>
  <text x="70" y="354" text-anchor="middle" font-family="'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, monospace"
        font-size="16" font-weight="500" fill="#000000">Your AI Tools</text>
  <circle cx="390" cy="322" r="9" fill="#000000"/>
  <text x="390" y="354" text-anchor="middle" font-family="'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, monospace"
        font-size="16" font-weight="500" fill="#000000">New AI</text>

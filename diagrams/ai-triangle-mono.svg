  <text x="230" y="240" text-anchor="middle" font-family="'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, monospace" font-size="19"
        fill="#000000">You</text>
  <circle cx="230" cy="58" r="9" fill="#000000"/>
